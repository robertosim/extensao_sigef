<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#006633"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a9c86"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="360" fill="#ffffff"/>

  <!-- Etapas -->
  <g stroke="#006633" stroke-width="2" fill="#EAF6E4">
    <rect x="30" y="80" width="180" height="76" rx="8"/>
    <rect x="255" y="80" width="180" height="76" rx="8"/>
    <rect x="480" y="80" width="180" height="76" rx="8"/>
    <rect x="705" y="80" width="205" height="76" rx="8"/>
  </g>

  <g fill="#006633" font-size="16" font-weight="bold" text-anchor="middle">
    <text x="120" y="112">1. Instalação</text>
    <text x="345" y="112">2. Extração</text>
    <text x="570" y="112">3. Download</text>
    <text x="807" y="112">4. Mapa Interativo</text>
  </g>

  <g fill="#3d6b4f" font-size="12" text-anchor="middle">
    <text x="120" y="136">carregar extensão no Chrome</text>
    <text x="345" y="136">CSV consolidado das parcelas</text>
    <text x="570" y="136">PDF / CSV / SHP em lote</text>
    <text x="807" y="136">HTML interativo + Leaflet</text>
  </g>

  <!-- Setas principais -->
  <g stroke="#006633" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="118" x2="250" y2="118"/>
    <line x1="435" y1="118" x2="475" y2="118"/>
    <line x1="660" y1="118" x2="700" y2="118"/>
  </g>

  <!-- Ciclo -->
  <path d="M807,80 L807,40 L345,40 L345,72" stroke="#006633" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="500" y="18" width="150" height="24" rx="4" fill="#ffffff"/>
  <text x="575" y="35" font-size="13" font-weight="bold" fill="#006633" text-anchor="middle">repetir o ciclo</text>

  <!-- Ligações tracejadas até o Logs -->
  <g stroke="#7a9c86" stroke-width="1.8" stroke-dasharray="6,5" fill="none">
    <line x1="345" y1="156" x2="345" y2="250"/>
    <line x1="570" y1="156" x2="570" y2="250"/>
    <line x1="807" y1="156" x2="807" y2="250"/>
    <line x1="345" y1="250" x2="807" y2="250"/>
    <line x1="570" y1="250" x2="570" y2="268" marker-end="url(#arrowDashed)"/>
  </g>

  <!-- Caixa de Logs -->
  <rect x="340" y="272" width="460" height="64" rx="8" fill="#1e1e1e" stroke="#006633" stroke-width="2"/>
  <text x="570" y="300" font-size="15" font-weight="bold" fill="#4ec9b0" text-anchor="middle">Sistema de Logs</text>
  <text x="570" y="322" font-size="12" fill="#d4d4d4" text-anchor="middle">DEBUG por fase da busca • histórico persistido (2.000 registros)</text>
</svg>
